cv:
  name: Yuefeng Hu
  location: Tokyo
  email: huyuefeng99@gmail.com
  social_networks:
    - network: LinkedIn
      username: yuefeng-hu
    - network: GitHub
      username: IceFox99
  sections:
    experience:
      - company: DataVisor
        position: Software Engineer
        location: Tokyo, Japan
        start_date: 2025-02
        end_date: present
        highlights:
          - Develop features for and maintain the feature platform and rule engine behind a real-time fraud detection product — Java/Spring over Kafka, Flink, ClickHouse and Redis — running under a 10 ms p99 decisioning budget on several TB of transaction data per day
          - Carry production on-call — alert triage, traffic failover, Kubernetes cluster and pod debugging; diagnose live JVM services under load with Arthas, jcmd, async-profiler and thread/heap dump analysis
          - Built a fully local deployment and test environment by removing remote AWS S3 and Flink dependencies, letting engineers reproduce and debug the entire stack on one machine with Docker and local services
    projects:
      - name: Bugfox
        date: '[GitHub](https://github.com/IceFox99/Bugfox)'
        highlights:
          - Automated trace-based root-cause analyzer for software regressions — no manual bisection, resolves each case in under 1 minute, 83% localization accuracy on 12 real-world regressions from the BugsJS benchmark
          - 'Tools Used: JavaScript, Node.js, Shell'
      - name: Sand
        date: '[GitHub](https://github.com/IceFox99/Trashcan/tree/Sand)'
        highlights:
          - Programming language implemented from scratch in C++ — hand-written LL(1) parser, interpreter and runtime, supporting explicit function inlining, function redefinition and labeled loops
          - 'Tools Used: C++, Make/CMake'
    technologies:
      - label: Languages
        details: Java, C++, C, Python, SQL, JavaScript
      - label: Backend & Infrastructure
        details: Spring, Linux, Shell Scripting, Docker, Kubernetes, AWS S3, Make/CMake, Git
      - label: Data & Streaming
        details: Kafka, Flink, Redis, ClickHouse, Doris, Yugabyte, MySQL
      - label: Observability & Debugging
        details: Grafana, Arthas, jcmd, async-profiler, thread/heap dump analysis
    publications:
      - title: "Yet Another Trace-Based Approach for the Cause of Software Regressions in JavaScript and Python"
        authors:
          - Feng Dai
          - '***Yuefeng Hu***'
          - Tetsuro Yamazaki
          - Shigeru Chiba
        doi: 10.1109/QRS65678.2025.00050
        date: 2025-07
        journal: "QRS '25"
      - title: "Bugfox: A Trace-Based Analyzer for Localizing the Cause of Software Regression in JavaScript"
        authors:
          - '***Yuefeng Hu***'
          - Hiromu Ishibe
          - Feng Dai
          - Tetsuro Yamazaki
          - Shigeru Chiba
        doi: 10.1145/3687997.3695648
        date: 2024-10
        journal: "SLE '24"
    education:
      - institution: The University of Tokyo
        area: Computer Science
        degree: MS
        start_date: 2022-10
        end_date: 2024-09
        highlights:
          - 'GPA: 4.0/4.0'
          - 'First-author paper at [SLE ''24](https://conf.researchr.org/home/sle-2024); all source code and artifacts open sourced'
      - institution: Beijing University of Posts and Telecommunications
        area: Software Engineering
